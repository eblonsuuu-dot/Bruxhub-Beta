<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BruxHub — каталог игровых модификаций и инструментов</title>
<meta name="description" content="BruxHub — каталог игровых модификаций, клиентов и инструментов с поиском, фильтрами и быстрыми ссылками на загрузку.">
<meta name="theme-color" content="#0a0612">
<style>
:root{--bg:#07040d;--bg2:#110a1f;--card:#150d26;--line:#2a1b47;--p:#8b4dff;--p2:#b78cff;--text:#f1ecfb;--mute:#a79cc0;--ok:#4ade80;--warn:#fbbf24;--err:#f87171;--r:18px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:76px;-webkit-text-size-adjust:100%}
body{background:radial-gradient(900px 500px at 85% -5%,#2a1259 0,transparent 60%),radial-gradient(700px 400px at -10% 30%,#1b0b3a 0,transparent 60%),var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;min-height:100vh}
a{color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--p2);outline-offset:2px;border-radius:8px}
.wrap{width:min(1120px,100% - 32px);margin:0 auto}
section{padding:56px 0}
h1,h2,h3{line-height:1.2;letter-spacing:-.02em}
h2{font-size:clamp(1.5rem,3.5vw,2.1rem);margin-bottom:8px}
.sub{color:var(--mute);margin-bottom:24px;max-width:60ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font:600 1rem inherit;font-family:inherit;text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s}
.btn:hover{background:#1d1233;box-shadow:0 0 0 1px var(--p) inset}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#7a35ee,#a366ff);border-color:transparent;box-shadow:0 8px 28px -8px #8b4dff}
.btn.primary:hover{box-shadow:0 10px 34px -6px #a366ff}
.btn[aria-disabled=true]{opacity:.55;cursor:not-allowed}
.btn.sm{min-height:44px;padding:0 16px;font-size:.95rem}
header{position:sticky;top:0;z-index:50;background:rgba(7,4,13,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;min-height:64px}
.logo{font-weight:800;font-size:1.35rem;text-decoration:none;letter-spacing:-.03em}
